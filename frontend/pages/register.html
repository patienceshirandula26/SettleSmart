<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | SettleSmart</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-logo">
        <span class="logo-badge">S</span>
        <span>SettleSmart</span>
    </div>

    <div class="auth-card">

        <h1>Create your account</h1>
        <p>Set up your settlement checklist in a couple of minutes.</p>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullName">Full name</label>
                <input type="text" id="fullName" name="fullName" placeholder="Jane Student" required>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="student@university.edu.au" required>
            </div>

            <div class="form-group">
                <label for="university">University</label>
                <input type="text" id="university" name="university" placeholder="Queensland University of Technology">
            </div>

            <div class="form-group">
                <label for="arrivalDate">Arrival date in Australia <span class="label-hint">(optional)</span></label>
                <input type="date" id="arrivalDate" name="arrivalDate">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••"
                       required minlength="8" autocomplete="new-password">

                <div class="strength" id="passwordStrength" hidden>
                    <div class="strength-track"><div class="strength-fill" id="strengthFill"></div></div>
                    <span class="strength-label" id="strengthLabel"></span>
                </div>

                <ul class="password-rules" id="passwordRules">
                    <li data-rule="length">At least 8 characters</li>
                    <li data-rule="letter">Contains a letter</li>
                    <li data-rule="number">Contains a number</li>
                    <li data-rule="personal">Doesn't contain your name or email</li>
                </ul>
            </div>

            <p id="message" class="form-message"></p>

            <button type="submit" class="btn btn-block">Create Account</button>

        </form>

    </div>

    <p class="auth-footer">Already have an account? <a href="login.html" class="link">Log in</a></p>

</div>

<script src="../js/api.js"></script>
<script src="../js/register.js"></script>

</body>

</html>
