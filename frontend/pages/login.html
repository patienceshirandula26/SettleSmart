<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | SettleSmart</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-logo">
        <span class="logo-badge">S</span>
        <span>SettleSmart</span>
    </div>

    <div class="auth-card">

        <h1>Welcome back</h1>
        <p>Log in to manage your settlement checklist.</p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="student@university.edu.au" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="form-row">
                <label class="checkbox">
                    <input type="checkbox" id="remember" name="remember">
                    Remember me
                </label>
                <a href="#" class="link">Forgot password?</a>
            </div>

            <p id="message" class="form-message"></p>

            <button type="submit" class="btn btn-block">Log In</button>

        </form>

    </div>

    <p class="auth-footer">New to SettleSmart? <a href="register.html" class="link">Create an account</a></p>

</div>

<script src="../js/api.js"></script>
<script src="../js/script.js"></script>

</body>

</html>
