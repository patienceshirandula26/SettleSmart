<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | SettleSmart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/dashboard.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="logo">
            <span class="logo-mark">S</span>
            <span class="logo-text">SettleSmart</span>
        </div>

        <nav class="nav-menu">
            <a href="dashboard.html" class="nav-link">Dashboard</a>
            <a href="checklist.html" class="nav-link">Settlement Checklist</a>
            <a href="documents.html" class="nav-link">Documents</a>
            <a href="reminders.html" class="nav-link">Reminders</a>
            <a href="resources.html" class="nav-link">Official Resources</a>
            <a href="profile.html" class="nav-link">Profile</a>
            <a href="settings.html" class="nav-link active">Settings</a>
        </nav>

        <div class="sidebar-spacer"></div>

        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="avatar">ST</div>
                <div>
                    <p class="sidebar-user-name">Student</p>
                    <p class="sidebar-user-role">Int. Student · QLD</p>
                </div>
            </div>

            <a href="../index.html" class="logout-link">Logout</a>
        </div>

    </aside>

    <main class="main-content">

        <header class="topbar">
            <label class="search-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="7"/>
                    <path d="m20 20-3.5-3.5" stroke-linecap="round"/>
                </svg>
                <input type="search" placeholder="Search tasks, documents…" aria-label="Search tasks and documents">
            </label>

            <div class="topbar-right">
                <button class="bell" type="button" aria-label="Notifications">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" stroke-linecap="round"/>
                    </svg>
                    <span class="bell-dot"></span>
                </button>

                <div class="avatar">ST</div>

                <div>
                    <p class="topbar-name">Student</p>
                    <p class="topbar-role">Student</p>
                </div>
            </div>
        </header>

        <section class="page-heading">
            <h1>Settings</h1>
            <p>Manage your account, notifications and app preferences.</p>
        </section>

    </main>

</div>

</body>
</html>
